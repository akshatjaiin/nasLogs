version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: smokedetector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  web:
    build:
      context: ./backend
    restart: always
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: smokedetector
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
    restart: always
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: smokedetector
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  beat:
    build:
      context: ./backend
    restart: always
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: smokedetector
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    image: nginx:alpine
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  pgdata:
