
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: smokedetector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smokedetector"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
    restart: always
    volumes:
      - staticfiles:/app/staticfiles
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: smokedetector
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: 'False'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    restart: always
    command: celery -A config worker -l info --concurrency=2 --max-tasks-per-child=1000 --max-memory-per-child=256000
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: smokedetector
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      CELERY_BROKER_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 10 2>/dev/null | grep -q 'pong' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    restart: always
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: smokedetector
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      CELERY_BROKER_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  staticfiles:
