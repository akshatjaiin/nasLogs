version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smokedetector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  web:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: smokedetector
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
  worker:
    build:
      context: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: smokedetector
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
  beat:
    build:
      context: ./backend
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: smokedetector
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
volumes:
  pgdata:
