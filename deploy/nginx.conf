# ============================================================
# NAS Logs — NGINX Configuration
# ============================================================
# HTTP server (port 80) — used in development and as HTTPS redirect in production
# To enable HTTPS: uncomment the SSL server block below and update cert paths

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large SDK telemetry batches (default 1M is too small)
    client_max_body_size 25M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Redirect bare /api to /api/ to prevent SPA fallback from returning HTML
    location = /api {
        return 301 /api/;
    }

    # Proxy API requests to Django backend container
    location /api/ {
        proxy_pass http://web:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # SPA Routing: Fallback all unknown routes (/alerts, /settings, /incidents) to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

